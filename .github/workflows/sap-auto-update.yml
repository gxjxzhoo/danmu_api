name: Sync upstream & update SAP danmuapi

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新部署'
        type: boolean
        default: false

concurrency:
  group: sap-danmu-update
  cancel-in-progress: false

env:
  CF_API: https://api.cf.ap21.hana.ondemand.com
  CF_ORG: 1366518btrial
  CF_SPACE: dev
  APP_NAME: danmuapi
  APP_URL: https://danmuapi.cert.cfapps.ap21.hana.ondemand.com
  UPSTREAM: huangxd-/danmu_api

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SAP_EMAIL: ${{ secrets.SAP_EMAIL }}
      SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: 同步上游 (fork sync)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main | jq -r '.message // .'

      - name: 拉取源码（已同步上游的 fork）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 读取版本
        id: upstream
        run: |
          V=$(grep -m1 "VERSION:" danmu_api/configs/globals.js | sed -E "s/.*VERSION: '([^']+)'.*/\1/")
          U=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/main/danmu_api/configs/globals.js" | grep -m1 "VERSION:" | sed -E "s/.*VERSION: '([^']+)'.*/\1/" || true)
          [ -n "$V" ] || { echo "取不到版本号"; exit 1; }
          echo "fork 源码版本: $V  上游版本: ${U:-未知}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"; echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 安装 cf CLI 并登录
        if: steps.upstream.outputs.ready == 'true'
        run: |
          [ -n "$SAP_EMAIL" ] && [ -n "$SAP_PASSWORD" ] || { echo "缺少 Secrets: SAP_EMAIL / SAP_PASSWORD"; exit 1; }
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" | sudo tar -zx -C /usr/local/bin cf8 cf
          cf api "$CF_API"
          CF_USERNAME="$SAP_EMAIL" CF_PASSWORD="$SAP_PASSWORD" cf auth
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: 对比当前部署版本
        id: current
        if: steps.upstream.outputs.ready == 'true'
        run: |
          GUID=$(cf app "$APP_NAME" --guid)
          echo "guid=$GUID" >> "$GITHUB_OUTPUT"
          CUR=$(cf curl "/v3/apps/$GUID" | jq -r '.metadata.labels["danmu-version"] // ""')
          echo "当前已部署版本: ${CUR:-未记录}"; echo "image=${CUR:-未记录}" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "${{ steps.upstream.outputs.tag }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "已是最新"; echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 滚动更新（不停机）
        id: push
        if: steps.current.outputs.need == 'true'
        run: |
          set -o pipefail
          printf '.git\n.github\n' > .cfignore
          if ! cf push "$APP_NAME" -p . --strategy rolling 2>&1 | tee push.log; then
            tail -25 push.log | sed 's/^/::error::/'
            cf logs "$APP_NAME" --recent 2>&1 | grep -v "\[RTR" | grep -iE "err|fail|crash|exit" | tail -15 | sed 's/^/::error::LOG /'
            exit 1
          fi
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$APP_URL" || true)
            [ "$code" = "200" ] && break; sleep 10
          done
          cf app "$APP_NAME"
          [ "$code" = "200" ] || { echo "::error::更新后访问异常: $code"; exit 1; }
          cf curl -X PATCH "/v3/apps/${{ steps.current.outputs.guid }}" -d '{"metadata":{"labels":{"danmu-version":"${{ steps.upstream.outputs.tag }}"}}}' >/dev/null

      - name: Telegram 通知
        if: always() && steps.current.outputs.need == 'true'
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || { echo "::warning::TG 未配置"; exit 0; }
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            MSG="✅ SAP danmuapi 已更新
          版本: ${{ steps.upstream.outputs.tag }}
          原版本: ${{ steps.current.outputs.image }}"
          else
            MSG="❌ SAP danmuapi 更新失败
          目标版本: ${{ steps.upstream.outputs.tag }}，请查看 Actions 日志"
          fi
          curl -sS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$TG_CHAT_ID" --data-urlencode text="$MSG" \
            | jq -r 'if .ok then "TG 已发送" else "TG 失败: \(.description)" end'
